<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SEO_TITLE}}</title>
    
    <meta name="description" content="{{META_DESCRIPTION}}">
    <link rel="canonical" href="{{CANONICAL_URL}}">

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="{{SEO_TITLE}}">
    <meta property="og:description" content="{{META_DESCRIPTION}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta property="og:url" content="{{CANONICAL_URL}}">
    <meta property="og:type" content="article">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{SEO_TITLE}}">
    <meta name="twitter:description" content="{{META_DESCRIPTION}}">
    <meta name="twitter:image" content="{{OG_IMAGE}}">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/src/css/bootstrap.min.css">
    <link rel="stylesheet" href="/src/css/app.css">
</head>
<body class="bg-light">

    <div id="header-placeholder"></div>
    
    <div id="mega-menu-placeholder"></div>
    <div id="breadcrumb-placeholder"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    
                    <article class="card shadow-sm border-0 bg-white p-4 p-md-5 rounded-4">
                        
                        <!-- Breadcrumbs -->
                        <nav aria-label="breadcrumb" class="mb-3">
                            <ol class="breadcrumb mb-2">
                                <li class="breadcrumb-item"><a href="/blog.html" class="text-decoration-none">Blog Feed</a></li>
                                <li class="breadcrumb-item active text-truncate" aria-current="page" style="max-width: 250px;">{{TITLE}}</li>
                            </ol>
                        </nav>

                        <!-- Category Badge -->
                        <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-pill fw-semibold d-inline-block mb-3 align-self-start">{{CATEGORY}}</span>
                        
                        <!-- Main H1 Title -->
                        <h1 class="fw-bold text-dark display-6 mb-3">{{TITLE}}</h1>
                        
                        <!-- Meta Info -->
                        <div class="d-flex align-items-center text-muted small gap-3 pb-3 mb-4 border-bottom">
                            <span><i class="far fa-user me-1"></i> By {{AUTHOR}}</span>
                            <span>•</span>
                            <span><i class="far fa-calendar-alt me-1"></i> {{DATE}}</span>
                        </div>

                        <!-- Blog Content Body (Single Wrapper) -->
                        <div class="blog-content text-dark lh-lg">
                            {{BLOG_CONTENT}}
                        </div>

                        <!-- Footer Navigation -->
                        <div class="mt-5 pt-4 border-top d-flex justify-content-between align-items-center">
                            <a href="/blog.html" class="btn btn-dark btn-sm px-4">&larr; Back to Guides</a>
                            <a href="#" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;" class="text-muted small text-decoration-none">Back to top &uarr;</a>
                        </div>

                    </article>

                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/src/js/bootstrap.bundle.min.js"></script>
    <script src="/src/js/layout.js" type="module"></script>
</body>
</html>
