<!DOCTYPE html>
<html lang="en">
<head>
    <title>Industrial Power Tools & Hardware Catalog | Haryana Tools</title>
    <meta name="description" content="Browse our complete catalog of industrial power tools, heavy machinery, precision hand tools, and solar equipment with verified GST invoices.">
    
    
    <div id="head-placeholder"></div>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
   <div id="head-placeholder"></div>
</head>
<body>

    <!-- Header / Navbar -->
    <div id="header-placeholder"></div>
    
    <!-- Mega Menu -->
    <!-- #include virtual="partials/mega-menu.html" -->
    
    <!-- Breadcrumb -->
    <div id="breadcrumb-placeholder"></div>

    <main id="main-content" class="catalog-layout">
        <!-- Sidebar Filters -->
        <aside id="sidebar-filters">
    <h3>Filters</h3>
    <div class="filter-group mb-3">
        <label for="category-filter" class="form-label fw-bold">Category</label>
        <select id="category-filter" class="form-select">
            <option value="">All Categories</option>
        </select>
    </div>
    
    <!-- Add Brands Filter Dropdown -->
    <div class="filter-group mb-3">
        <label for="brand-filter" class="form-label fw-bold">Brand</label>
        <select id="brand-filter" class="form-select">
            <option value="">All Brands</option>
        </select>
    </div>

    <div class="filter-group mb-3">
        <label for="sort-select" class="form-label fw-bold">Sort By</label>
        <select id="sort-select" class="form-select">
            <option value="default">Featured</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="name">Name: A to Z</option>
        </select>
    </div>
</aside>

        <section id="category-products">
            <h1 id="category-title">All Products</h1>
            <input type="text" id="search-input" class="search-box" placeholder="Search tools, equipment, SKUs...">
            
           <!-- Product Grid Container -->
<div id="product-grid" class="row row-cols-1 row-cols-md-3 g-4">
    <!-- Products render here -->
</div>

            <!-- Add this container right below your product grid -->
            <div id="pagination-container"></div>

            <div id="toast-placeholder"></div>
            <!-- Pagination -->
            <!-- #include virtual="partials/pagination.html" -->
        </section>
    </main>

    <!-- Footer -->
    <footer id="footer-placeholder">
        <p>&copy; 2026 JK Enterprises / Haryana Tools. All rights reserved.</p>
    </footer>
    

    <!-- Script Integration -->
    <script src="../src/js/category.js" type="module"></script>
    <script src="../src/js/layout.js" type="module"></script>
</body>
</html>
