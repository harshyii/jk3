<!DOCTYPE html>
<html lang="en">
<head>
    <div id="head-placeholder"></div>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog - Haryana Tools / JK Enterprises</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .catalog-page-layout { display: flex; gap: 30px; padding: 20px; max-width: 1400px; margin: 0 auto; }
        .catalog-sidebar { width: 280px; flex-shrink: 0; background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #dee2e6; height: fit-content; }
        .catalog-main { flex-grow: 1; min-width: 0; }
        @media (max-width: 992px) { .catalog-page-layout { flex-direction: column; } .catalog-sidebar { width: 100%; } }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <div id="header-placeholder"></div>
    
    <!-- Breadcrumb -->
    <div id="breadcrumb-placeholder"></div>

    <main class="catalog-page-layout">
        <!-- Sidebar Filters -->
        <aside class="catalog-sidebar">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">Filters</h4>
                <!-- Clear Filters Button -->
                <button type="button" id="clear-filters-btn" class="btn btn-sm btn-outline-secondary">Reset All</button>
            </div>
            
            <div class="mb-3">
                <label for="category-filter" class="form-label fw-bold">Category</label>
                <select id="category-filter" class="form-select">
                    <option value="">All Categories</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="brand-filter" class="form-label fw-bold">Brand</label>
                <select id="brand-filter" class="form-select">
                    <option value="">All Brands</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="sort-select" class="form-label fw-bold">Sort By</label>
                <select id="sort-select" class="form-select">
                    <option value="default">Featured</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                    <option value="name">Name: A to Z</option>
                </select>
            </div>
        </aside>

        <!-- Main Product Section -->
        <section class="catalog-main">
            <h1 id="category-title" class="mb-3">All Products</h1>
            <input type="text" id="search-input" class="form-control mb-4 shadow-sm" placeholder="Search tools, equipment, SKUs...">
            
            <!-- Product Grid -->
            <div id="product-grid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4">
                <!-- Product cards injected here -->
            </div>

            <!-- Pagination Container -->
            <div id="pagination-container"></div>
            
            <div id="toast-placeholder"></div>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- Script Integration -->
    <script src="src/js/category.js" type="module"></script>
    <script src="src/js/search.js" type="module"></script>
    <script src="src/js/layout.js" type="module"></script>
</body>
</html>
