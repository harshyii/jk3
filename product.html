<!DOCTYPE html>
<html lang="en">
<head>

    <div id="head-placeholder"></div>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - StoreName</title>
    <link rel="stylesheet" href="src/css/bootstrap.min.css">
    <link rel="stylesheet" href="src/css/app.css">
</head>
<body class="bg-light">
    
    <!-- Header / Navbar -->
    <div id="header-placeholder"></div>
    
    <!-- Breadcrumb -->
    <div id="breadcrumb-placeholder"></div>

    <main id="main-content" class="container py-5">
        <section id="product-detail-container" class="row g-5 align-items-start">
            
            <!-- Product Gallery Column -->
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm p-3 bg-white rounded-4">
                    <div class="product-gallery">
                        <!-- Main Image Display -->
                        <div class="main-image-container mb-3 text-center bg-light rounded-3 overflow-hidden" style="min-height: 380px; display: flex; align-items: center; justify-content: center;">
                            <img id="main-product-image" src="" alt="Product Image" class="main-img img-fluid" style="max-height: 400px; object-fit: contain;">
                        </div>

                        <!-- Thumbnail Gallery Strip for up to 8 images -->
                        <div id="product-thumbnails" class="d-flex gap-2 overflow-auto py-2" style="display: none;">
                            <!-- Dynamic thumbnails injected here -->
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Product Info Column -->
            <div class="col-lg-6">
                <div class="mb-2">
                    <span id="product-category" class="badge bg-secondary mb-2">Category</span>
                    <span id="product-stock" class="badge bg-success ms-2" style="display: none;">In Stock</span>
                </div>

                <h1 id="product-title" class="fw-bold mb-3 fs-2 text-dark">Loading...</h1>
                
                <div class="d-flex align-items-center gap-3 mb-3 text-muted small">
                    <div>Brand: <strong id="product-brand" class="text-dark">--</strong></div>
                    <div>•</div>
                    <div>SKU / ASIN: <strong id="product-sku" class="text-dark">--</strong></div>
                </div>

                <!-- Pricing Block -->
                <div class="bg-white border p-3 rounded-3 mb-4 d-flex align-items-baseline gap-3 shadow-sm">
                    <span id="product-price" class="text-primary fw-bold fs-3">₹0</span>
                    <span id="product-mrp" class="text-decoration-line-through text-muted fs-5" style="display: none;">₹0</span>
                    <span id="product-discount" class="badge bg-danger fs-6" style="display: none;">0% OFF</span>
                </div>

                <!-- Quantity & Purchase Actions -->
                <div class="row g-3 align-items-center mb-4">
                    <div class="col-auto">
                        <label for="product-quantity" class="col-form-label fw-semibold">Quantity:</label>
                    </div>
                    <div class="col-4 col-md-3">
                        <input type="number" id="product-quantity" class="form-control text-center" value="1" min="1">
                    </div>
                </div>

                <div class="purchase-actions d-grid gap-2 d-md-flex mb-4">
                    <button id="add-to-cart-btn" class="btn btn-outline-primary btn-lg flex-grow-1 shadow-sm py-3 fw-semibold">Add to Cart</button>
                    <button id="buy-now-btn" class="btn btn-primary btn-lg flex-grow-1 shadow-sm py-3 fw-semibold">Buy Now</button>
                </div>
                
                <div class="product-description-wrapper mb-4 border-top pt-4">
                    <h5 class="fw-bold mb-3">Description</h5>
                    <div id="product-description" class="text-muted" style="line-height: 1.7;"></div>
                </div>

                <!-- Specifications Table -->
                <div class="product-specs-wrapper border-top pt-4">
                    <h5 class="fw-bold mb-3">Specifications</h5>
                    <div class="table-responsive mb-4">
                        <table class="table table-striped table-bordered text-sm align-middle" id="product-specs-table">
                            <!-- Dynamic specs injected here -->
                        </table>
                    </div>
                </div>

            </div>
        </section>

        <!-- Anonymous Customer Review Section -->
        <section class="mt-5 pt-4 border-top">
            <div class="row">
                <div class="col-lg-8">
                    <h3 class="fw-bold mb-4">Customer Reviews</h3>
                    
                    <div class="card border-0 shadow-sm p-4 mb-4 rounded-4 bg-white">
                        <h5 class="fw-semibold mb-3">Leave an Anonymous Review</h5>
                        <form id="anonymous-comment-form">
    <!-- Hidden Anti-Spam Honeypot Field (Invisible to real users, bots fill it out) -->
    <div style="display:none;">
        <input type="text" id="website_trap" name="website_trap" autocomplete="off">
    </div>

    <div class="mb-3">
        <label for="comment-author" class="form-label small fw-semibold text-muted">Your Nickname (Optional)</label>
        <input type="text" class="form-control" id="comment-author" placeholder="e.g., Verified Tool User">
    </div>
    
    <div class="mb-3">
        <label for="comment-rating" class="form-label small fw-semibold text-muted">Rating</label>
        <select class="form-select" id="comment-rating">
            <option value="5">⭐⭐⭐⭐⭐ - Excellent</option>
            <option value="4">⭐⭐⭐⭐ - Good</option>
            <option value="3">⭐⭐⭐ - Average</option>
            <option value="2">⭐⭐ - Poor</option>
            <option value="1">⭐ - Terrible</option>
        </select>
    </div>
    
    <div class="mb-3">
        <label for="comment-text" class="form-label small fw-semibold text-muted">Your Experience</label>
        <textarea class="form-control" id="comment-text" rows="3" placeholder="Share how this product performed..." required></textarea>
    </div>
    
    <button type="submit" id="submit-review-btn" class="btn btn-dark px-4">Post Review</button>
</form>
                    </div>

                    <div id="comments-list-container">
                        <!-- Injected reviews show up here -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Related Products Section -->
        <section id="related-products-section" class="mt-5 pt-4 border-top">
            <h3 class="fw-bold mb-4">Related Products</h3>
            <div id="related-products-grid" class="row">
                <!-- Dynamically loaded grid -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>
    <div id="toast-placeholder"></div>

    <!-- Scripts -->
    <script src="src/js/layout.js" type="module"></script>
    <script src="src/js/bootstrap.bundle.min.js"></script>
    <script src="src/js/product.js" type="module"></script>
</body>
</html>
